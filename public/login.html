<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#050914" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RP Thermo" />
<title>Casa RP Thermo — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffbd17;--muted:#91a0b7;--line:rgba(255,255,255,.11);--green:#4ade80;--red:#f05252}
body{min-height:100vh;background:radial-gradient(circle at 18% 8%,rgba(23,83,175,.42),transparent 34%),radial-gradient(circle at 88% 14%,rgba(255,189,23,.14),transparent 35%),linear-gradient(135deg,#020711,#07152a 55%,#020711);display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;color:#f7fbff}
body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 75%);pointer-events:none}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;margin:20px}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(13,29,53,.97),rgba(6,15,30,.98));border-radius:32px;padding:44px 40px;box-shadow:0 25px 80px rgba(0,0,0,.55)}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:36px}
.logo-icon{width:54px;height:54px;border:2px solid rgba(255,255,255,.85);transform:rotate(45deg);border-radius:10px;display:grid;place-items:center;flex:0 0 54px}
.logo-icon span{transform:rotate(-45deg);font-weight:900;font-size:21px;color:var(--gold)}
.logo-text h1{font-size:21px;font-weight:900;line-height:1;white-space:nowrap}
.logo-text h1 b{color:var(--gold)}
.logo-text p{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.6px}
.eyebrow{font:900 10px 'DM Mono',monospace;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:6px}
h2{font-size:30px;font-weight:900;letter-spacing:-1.2px;margin-bottom:28px;line-height:1}
label{display:block;font:900 10px 'DM Mono',monospace;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px}
input{width:100%;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:14px;color:#f7fbff;padding:14px 16px;font-family:Inter,sans-serif;font-size:15px;outline:none;transition:.2s;margin-bottom:18px}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,189,23,.1)}
input::placeholder{color:var(--muted)}
.btn{width:100%;background:var(--gold);color:#050914;border:none;border-radius:14px;padding:15px;font:900 15px Inter,sans-serif;cursor:pointer;transition:.2s;margin-top:4px;letter-spacing:.2px}
.btn:hover{background:#ffc93a;transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,189,23,.3)}
.btn:disabled{opacity:.6;transform:none;cursor:default}
.err{background:rgba(240,82,82,.12);border:1px solid rgba(240,82,82,.35);color:#f87171;border-radius:13px;padding:13px 16px;font-size:13px;margin-bottom:18px;display:none;line-height:1.4}
.foot{margin-top:28px;color:var(--muted);font-size:12px;text-align:center;line-height:1.6;border-top:1px solid var(--line);padding-top:20px}
.foot b{color:#f7fbff}
@media(max-width:460px){.card{padding:32px 24px}.wrap{margin:12px}}

/* ===== Splash ===== */
#splash{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 18% 8%,rgba(23,83,175,.5),transparent 34%),radial-gradient(circle at 88% 14%,rgba(255,189,23,.16),transparent 35%),linear-gradient(135deg,#020711,#07152a 55%,#020711);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash::before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,189,23,.1);top:50%;left:50%;transform:translate(-50%,-50%);animation:spPulse 3s ease-in-out infinite}
#splash::after{content:'';position:absolute;width:290px;height:290px;border-radius:50%;border:1px solid rgba(255,189,23,.16);top:50%;left:50%;transform:translate(-50%,-50%);animation:spPulse 3s .5s ease-in-out infinite}
@keyframes spPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1}}
.splash-mark{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;animation:spIn .8s cubic-bezier(.22,1,.36,1) both}
.splash-mark img{width:min(148px,40vw);height:min(148px,40vw);border-radius:28px;box-shadow:0 16px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);display:block}
.splash-mark h1{margin-top:24px;color:#f7fbff;font:900 1.5rem Inter,sans-serif;letter-spacing:-.5px}
.splash-mark h1 b{color:var(--gold)}
.splash-mark p{color:var(--muted);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;margin-top:8px}
.splash-dots{display:flex;gap:8px;margin-top:36px}
.splash-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);animation:spDot 1.4s ease-in-out infinite}
.splash-dots span:nth-child(2){animation-delay:.2s}.splash-dots span:nth-child(3){animation-delay:.4s}
@keyframes spDot{0%,100%{background:rgba(255,255,255,.18);transform:scale(1)}50%{background:var(--gold);transform:scale(1.35)}}
@keyframes spIn{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-mark">
    <img src="/icons/icon-192.png" alt="Casa RP Thermo" />
    <h1>CASA RP <b>THERMO</b></h1>
    <p>controle térmico inteligente</p>
  </div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <div class="logo-icon"><span>RP</span></div>
      <div class="logo-text">
        <h1>CASA RP <b>THERMO</b></h1>
        <p>controle térmico inteligente</p>
      </div>
    </div>
    <div class="eyebrow">Acesso seguro</div>
    <h2>Entrar no painel</h2>
    <div class="err" id="err"></div>
    <form id="form" autocomplete="on">
      <label for="user">Usuário</label>
      <input type="text" id="user" name="username" placeholder="Digite seu usuário" autocomplete="username" required />
      <label for="pass">Senha</label>
      <input type="password" id="pass" name="password" placeholder="••••••••" autocomplete="current-password" required />
      <button type="submit" class="btn" id="btn">Entrar no Painel</button>
    </form>
    <div class="foot">
      <b>Casa RP Resistências</b><br>
      R. Visc. do Uruguai, 264 — Centro, Niterói/RJ<br>
      (21) 96598-7979 · @rp_resistencias
    </div>
  </div>
</div>
<script>
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const user = document.getElementById('user').value.trim();
  const pass = document.getElementById('pass').value;
  btn.textContent = 'Verificando...';
  btn.disabled = true;
  err.style.display = 'none';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, pass })
    });
    const data = await r.json();
    if (r.ok && data.ok) {
      btn.textContent = 'Entrando...';
      location.href = '/';
    } else {
      err.textContent = data.error || 'Usuário ou senha incorretos.';
      err.style.display = 'block';
      btn.textContent = 'Entrar no Painel';
      btn.disabled = false;
      document.getElementById('pass').value = '';
      document.getElementById('pass').focus();
    }
  } catch {
    err.textContent = 'Erro de conexão. Verifique sua internet e tente novamente.';
    err.style.display = 'block';
    btn.textContent = 'Entrar no Painel';
    btn.disabled = false;
  }
};

window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 500);
  }, 1800);
});
</script>
</body>
</html>
